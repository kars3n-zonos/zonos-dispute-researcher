# Builds the second copy of the script (zonos-dispute-desk-sheets.user.js, its own name and update address) from
# zonos-dispute-researcher.user.js on every push that changes either script or the build, and commits it if it changed.
# Then both are published to the secret gist that Tampermonkey installs and updates from (the repo is private, so its
# own raw links don't work for Tampermonkey). That needs the GIST_TOKEN secret: a token with only the "gist" scope.
# The published copies (only those, never the repo) get the team sheet built in, from the SHEETS_URL and SHEETS_SECRET
# secrets, so everyone who installs from the team link tracks to the sheet with nothing to set up.
# Edit only zonos-dispute-researcher.user.js.
name: Build the Sheets copy

on:
  push:
    branches: [main]
    paths:
      - zonos-dispute-researcher.user.js
      - zonos-dispute-desk-sheets.user.js
      - build-sheets.ps1
      - .github/workflows/build-sheets.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-sheets
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: pwsh
        run: ./build-sheets.ps1

      - name: Commit if it changed
        run: |
          if git diff --quiet -- zonos-dispute-desk-sheets.user.js; then
            echo "Sheets edition already up to date."
            exit 0
          fi
          version=$(grep -m1 -oP '^// @version\s+\K\S+' zonos-dispute-researcher.user.js)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add zonos-dispute-desk-sheets.user.js
          git commit -m "v$version: Sheets copy built from the main script"
          git push

      - name: Publish to the gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: 9dd13b6c4c3ea4d1d6a876d45002c0a3
          SHEETS_URL: ${{ secrets.SHEETS_URL }}
          SHEETS_SECRET: ${{ secrets.SHEETS_SECRET }}
        run: |
          if [ -z "$GIST_TOKEN" ]; then
            echo "No GIST_TOKEN secret: the gist wasn't updated (publish it by hand, or add the secret)."
            exit 0
          fi
          # The team sheet goes into the published copies only (out/), on the one line the script keeps for it
          mkdir -p out
          python3 - <<'PY'
          import json, os, sys
          url, secret = os.environ.get('SHEETS_URL', ''), os.environ.get('SHEETS_SECRET', '')
          line = '  const TEAM = {};\n'
          for name in ['zonos-dispute-researcher.user.js', 'zonos-dispute-desk-sheets.user.js']:
              code = open(name, encoding='utf-8').read()
              if url and secret:
                  if code.count(line) != 1:
                      sys.exit(name + ': the TEAM line was not found exactly once, so nothing was published')
                  code = code.replace(line, '  const TEAM = ' + json.dumps({'sheetsUrl': url, 'sheetsSecret': secret}) + ';\n')
              open('out/' + name, 'w', encoding='utf-8', newline='\n').write(code)
          print('Team sheet built in.' if url and secret else 'No SHEETS_URL / SHEETS_SECRET secrets: published without the team sheet.')
          PY
          jq -n --rawfile a out/zonos-dispute-researcher.user.js --rawfile b out/zonos-dispute-desk-sheets.user.js \
            '{files: {"zonos-dispute-researcher.user.js": {content: $a}, "zonos-dispute-desk-sheets.user.js": {content: $b}}}' > gist.json
          curl -fsS -X PATCH -H "Authorization: Bearer $GIST_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/gists/$GIST_ID" --data @gist.json -o /dev/null
          echo "Published $(grep -m1 -oP '^// @version\s+\K\S+' zonos-dispute-researcher.user.js) to the gist."
