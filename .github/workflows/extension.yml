# Builds the Chrome extension ZIP whenever the script or the extension changes, and publishes it as a
# GitHub release named after the version. The same ZIP is what gets uploaded to the Chrome Web Store.
name: Build extension

on:
  push:
    branches: [main]
    paths:
      - manifest.json
      - zonos-dispute-researcher.user.js
      - extension/**
      - .github/workflows/extension.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Tampermonkey and Chrome each only update when the version goes up, so the two must match
      - name: Check the versions match
        run: |
          manifest=$(jq -r .version manifest.json)
          script=$(grep -m1 -oP '@version\s+\K\S+' zonos-dispute-researcher.user.js)
          if [ "$manifest" != "$script" ]; then
            echo "::error::manifest.json is $manifest but the script's @version is $script"
            exit 1
          fi
          echo "VERSION=$manifest" >> "$GITHUB_ENV"

      - name: Zip the extension
        run: zip -r -X zonos-dispute-researcher-extension.zip manifest.json zonos-dispute-researcher.user.js extension

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Chrome extension for v$VERSION. Upload this ZIP to the Chrome Web Store, or install it directly: unzip it, open chrome://extensions, turn on Developer mode, click Load unpacked and choose the unzipped folder."
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            gh release upload "v$VERSION" zonos-dispute-researcher-extension.zip --clobber
          else
            gh release create "v$VERSION" zonos-dispute-researcher-extension.zip --title "v$VERSION" --notes "$notes" --latest
          fi
